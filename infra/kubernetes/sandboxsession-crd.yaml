apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxsessions.recruitment.ncuscc.org
spec:
  group: recruitment.ncuscc.org
  scope: Namespaced
  names:
    plural: sandboxsessions
    singular: sandboxsession
    kind: SandboxSession
    shortNames: [ssess]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeRef, profileRef, attempt, networkMode, runtimeClassName, maxLifetimeSeconds]
              properties:
                nodeRef: { type: string, minLength: 1 }
                profileRef: { type: string, minLength: 1 }
                attempt: { type: integer, minimum: 1 }
                networkMode: { type: string, enum: [none] }
                runtimeClassName: { type: string, enum: [kata, firecracker] }
                maxLifetimeSeconds: { type: integer, minimum: 1 }
            status:
              type: object
              properties:
                phase: { type: string }
                workloadName: { type: string }
                agentReady: { type: boolean }
                terminalAttachable: { type: boolean }
                observedGeneration: { type: integer }
